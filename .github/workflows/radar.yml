name: Instagram Intelligence Radar

on:
  schedule:
    # UTC. Canary Islands: same time in winter, +1 hour locally in summer.
    - cron: "0 13 * * *"   # educational story
    - cron: "0 17 * * *"   # daily high-quality carousel
    - cron: "0 18 * * 0"   # weekly transparent results carousel
    - cron: "0 21 * * *"   # promising-token story
  workflow_dispatch:
    inputs:
      job:
        description: "Choose a safe Instagram job"
        type: choice
        options: [instagram, scoreboard, story_tip, story_radar, diagnose]
        default: diagnose

permissions:
  contents: write

concurrency:
  group: instagram-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instagram:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Pin the supported LTS image. ubuntu-latest moved to 26.04, which is not
    # supported by the pinned Playwright/Chromium release used for rendering.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_HOST: ${{ vars.IG_HOST || 'https://graph.facebook.com' }}
      BRAND: ${{ vars.BRAND || 'Is It Cooked' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      CHAINS: ${{ vars.CHAINS || 'solana,base' }}
      MIN_LIQUIDITY: ${{ vars.MIN_LIQUIDITY || '20000' }}
      MIN_VOLUME_1H: ${{ vars.MIN_VOLUME_1H || '25000' }}
      MIN_TXNS_1H: ${{ vars.MIN_TXNS_1H || '35' }}
      MIN_SCORE: ${{ vars.MIN_SCORE || '70' }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '72' }}
      REQUIRE_OFFICIAL_LINK: ${{ vars.REQUIRE_OFFICIAL_LINK || 'true' }}
      MEDIA_BRANCH: media
      MEDIA_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verified dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name 'instagram-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run reliability tests
        run: python -m unittest -v test_radar.py

      - name: Select job
        id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.schedule }}" in
            "0 13 * * *") job=story_tip ;;
            "0 17 * * *") job=instagram ;;
            "0 18 * * 0") job=scoreboard ;;
            "0 21 * * *") job=story_radar ;;
            *) job="${{ inputs.job || 'diagnose' }}" ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Prepare content
        if: steps.select.outputs.job != 'diagnose'
        shell: bash
        run: python bot.py "${{ steps.select.outputs.job }}_prepare"

      - name: Save prepared state
        if: steps.select.outputs.job != 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          git add -u state
          git add state/*.json
          git diff --cached --quiet && exit 0
          git commit -m "instagram: prepare ${{ steps.select.outputs.job }}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Publish temporary media branch
        if: steps.select.outputs.job != 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          rmdir "$tmp"
          git worktree add --detach "$tmp"
          cd "$tmp"
          git checkout --orphan media
          git rm -rf .
          if [[ "${{ steps.select.outputs.job }}" == "instagram" || "${{ steps.select.outputs.job }}" == "scoreboard" ]]; then
            while IFS= read -r file; do cp "$GITHUB_WORKSPACE/public/$file" .; done < <(
              python -c 'import json,os; print(*json.load(open(os.environ["GITHUB_WORKSPACE"]+"/state/ig_next.json"))["files"], sep="\n")'
            )
          else
            file="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_WORKSPACE"]+"/state/ig_story_next.json"))["file"])')"
            cp "$GITHUB_WORKSPACE/public/$file" .
          fi
          printf 'Temporary public media for Instagram. Replaced automatically.\n' > README.md
          git add .
          git commit -m "media: ${{ steps.select.outputs.job }} ${{ github.run_id }}"
          git push --force origin HEAD:media

      - name: Publish to Instagram
        if: steps.select.outputs.job != 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.select.outputs.job }}" == "instagram" || "${{ steps.select.outputs.job }}" == "scoreboard" ]]; then
            python bot.py instagram_publish
          else
            python bot.py story_publish
          fi

      - name: Save confirmed publication state
        if: steps.select.outputs.job != 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          git add -u state
          git add state/*.json
          git diff --cached --quiet && exit 0
          git commit -m "instagram: confirm ${{ steps.select.outputs.job }}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Diagnose Instagram connection
        if: steps.select.outputs.job == 'diagnose'
        run: python bot.py diagnose
